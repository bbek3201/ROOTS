name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a new push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The same four gates the project runs locally, in the order that
      # fails fastest: types, then lint, then the unit suite, then a full
      # production build.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The build reads these at module load. CI has no real project,
          # so give it syntactically valid placeholders — nothing here
          # connects to Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
